# Publish to PyPI using Trusted Publishing (OIDC).
# Configure the pending publisher on https://pypi.org (see docs/PYPI_TRUSTED_PUBLISHING.md).
# Actions are pinned to full SHAs (Supply-chain); bump intentionally when upgrading.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bandl/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify git tag matches pyproject version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Git tag v${TAG} must match project.version in pyproject.toml (found ${PKG})"
            exit 1
          fi

      - name: Install build
        run: pip install "build>=1.2,<2"

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 @ 2026-02-18
