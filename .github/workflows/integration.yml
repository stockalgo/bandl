# Live HTTP checks against Binance / CoinDCX public APIs.
# Does not run on every PR to avoid flakes and rate limits for contributors.

name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  live-apis:
    name: Live provider smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/bandl/ -m integration --override-ini="addopts="
