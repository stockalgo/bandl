# Live HTTP checks against Binance / CoinDCX public APIs.
# Does not run on every PR to avoid flakes and rate limits for contributors.

name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  live-apis:
    name: Live provider smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/bandl/ -m integration --override-ini="addopts="
